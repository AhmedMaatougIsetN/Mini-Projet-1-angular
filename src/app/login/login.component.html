<div class="container mt-5">
  <div class="row justify-content-md-center">
    <div class="col-12 col-md-8 col-lg-5">
      @if (erreur === 1) {
        <div class="alert alert-danger"><strong>Nom d’utilisateur ou mot de passe incorrect.</strong></div>
      }
      <form>
        <div class="form-group mb-4">
          <label for="username" class="fs-4">Nom Utilisateur :</label>
          <input id="username" type="text" name="username" class="form-control form-control-lg" [(ngModel)]="user.username">
        </div>
        <div class="form-group mb-4">
          <label for="password" class="fs-4">Mot de passe :</label>
          <input id="password" type="password" name="password" class="form-control form-control-lg" [(ngModel)]="user.password">
        </div>
        <div class="row justify-content-md-center">
          <button type="button" (click)="onLoggedin()" class="btn btn-lg btn-success mt-2">Connexion</button>
        </div>
      </form>
    </div>
  </div>
</div>
