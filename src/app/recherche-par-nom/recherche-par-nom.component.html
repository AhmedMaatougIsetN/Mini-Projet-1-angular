<div class="container">
  <h2>Recherche par nom</h2>
  <div class="form-group mb-3">
    <label for="searchTerm">Nom du laptop</label>
    <input id="searchTerm" type="text" [(ngModel)]="searchTerm" name="searchTerm" class="form-control">
  </div>

  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead><tr><th>Id</th><th>Nom</th><th>Prix</th><th>Date création</th><th>Type</th></tr></thead>
        <tbody>
          @for (laptop of laptopsFiltres; track laptop.idlaptop) {
            <tr>
              <td>{{laptop.idlaptop}}</td>
              <td>{{laptop.nomlaptop}}</td>
              <td>{{laptop.prixlaptop}}</td>
              <td>{{laptop.dateCreation | date:'dd/MM/yyyy'}}</td>
              <td>{{laptop.type?.nomType || 'PAS DE TYPE'}}</td>
            </tr>
          } @empty {
            <tr><td colspan="5">Aucun laptop trouvé</td></tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
